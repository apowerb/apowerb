## MCP Toolbox for Databases — Default config
## Documentation: https://googleapis.github.io/genai-toolbox/
##
## Top-level mappings (sources/tools/toolsets), keyed by name.
## Launched by iac/deploy.sh as: ./toolbox --tools-file <config> --address 0.0.0.0 --port 5000
##
## Dynamic extensions: a tools.dynamic.yaml file (gitignored, generated by the
## th2agent backend from MCP-DB tool_configs in Postgres) is merged on top of
## this file by iac/deploy.sh before launching the toolbox. End users add
## sources from the /tool-box UI; no edits to this file needed.
##

sources:
  th2-postgres:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    queryParams:
      sslmode: require
      search_path: ${DB_SCHEMA:th2agent_dev}
    kind: postgres
tools:
  search-agents:
    source: th2-postgres
    description: Search agents by name or description keyword.
    parameters:
    - name: keyword
      type: string
      description: The search keyword to find in agent name or description.
    statement: "SELECT agent_id, agent_name, agent_description, agent_model, agent_type\nFROM th2agent_dev.th2agents_store\nWHERE agent_name ILIKE '%' || $1 || '%'\n   OR agent_description ILIKE '%' ||\
      \ $1 || '%'\nLIMIT 20;\n"
    kind: postgres-sql
  list-agents:
    source: th2-postgres
    description: List all available agents with their configuration.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of agents to return.
    statement: 'SELECT agent_id, agent_name, agent_description, agent_model, agent_type

      FROM th2agent_dev.th2agents_store

      ORDER BY agent_name

      LIMIT $1;

      '
    kind: postgres-sql
  get-agent-details:
    source: th2-postgres
    description: Get full details of a specific agent by ID including tools and sub-agents.
    parameters:
    - name: agent_id
      type: integer
      description: The agent ID to look up.
    statement: "SELECT agent_id, agent_name, agent_description, agent_model, agent_type,\n       agent_instruction, agent_tools, sub_agents, input_schema, output_schema,\n       agent_model_params, code_executor\n\
      FROM th2agent_dev.th2agents_store\nWHERE agent_id = $1;\n"
    kind: postgres-sql
  list-tool-configs:
    source: th2-postgres
    description: List active tool configurations with their categories.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of tool configs to return.
    statement: "SELECT tool_config_id, tool_config_name, tool_name, tool_category,\n       tool_config_type, owner_id, status\nFROM th2agent_dev.tool_configs\nWHERE status = 'active'\nORDER BY tool_config_name\n\
      LIMIT $1;\n"
    kind: postgres-sql
  count-users:
    source: th2-postgres
    description: Count total registered users.
    parameters: []
    statement: SELECT COUNT(*) as total_users FROM th2agent_dev."user";
    kind: postgres-sql
  list-users:
    source: th2-postgres
    description: List users with their roles and registration date.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of users to return.
    statement: "SELECT id, email, full_name, role, is_active, credits,\n       created_at, last_login\nFROM th2agent_dev.\"user\"\nORDER BY created_at DESC\nLIMIT $1;\n"
    kind: postgres-sql
  list-integrations:
    source: th2-postgres
    description: List OAuth integrations configured by users.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of integrations to return.
    statement: 'SELECT i.id, u.email, i.provider, i.scopes, i.created_at

      FROM th2agent_dev.integrations i

      JOIN th2agent_dev."user" u ON u.id = i.user_id

      ORDER BY i.created_at DESC

      LIMIT $1;

      '
    kind: postgres-sql
  list-webhook-subscriptions:
    source: th2-postgres
    description: List active webhook subscriptions with their status.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of subscriptions to return.
    statement: "SELECT ws.id, ws.provider, ws.resource, ws.change_type,\n       ws.status, ws.agent_id, ws.expiration_datetime,\n       u.email as owner_email\nFROM th2agent_dev.webhook_subscriptions ws\n\
      JOIN th2agent_dev.\"user\" u ON u.id = ws.user_id\nORDER BY ws.created_at DESC\nLIMIT $1;\n"
    kind: postgres-sql
  list-transactions:
    source: th2-postgres
    description: List credit transactions with user details.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of transactions to return.
    statement: "SELECT t.id, u.email, t.type, t.amount, t.balance_after,\n       t.description, t.created_at\nFROM th2agent_dev.transactions t\nJOIN th2agent_dev.\"user\" u ON u.id = t.user_id\nORDER BY\
      \ t.created_at DESC\nLIMIT $1;\n"
    kind: postgres-sql
  agent-stats:
    source: th2-postgres
    description: Get statistics about agents grouped by model and type.
    parameters: []
    statement: 'SELECT agent_model, agent_type, COUNT(*) as count

      FROM th2agent_dev.th2agents_store

      GROUP BY agent_model, agent_type

      ORDER BY count DESC;

      '
    kind: postgres-sql
  search-hub-agents:
    source: th2-postgres
    description: Search public agents in the hub by keyword.
    parameters:
    - name: keyword
      type: string
      description: Search keyword for hub agents.
    statement: "SELECT *\nFROM th2agent_dev.hub_agents\nWHERE agent_name ILIKE '%' || $1 || '%'\n   OR agent_description ILIKE '%' || $1 || '%'\nLIMIT 20;\n"
    kind: postgres-sql
  list-notifications:
    source: th2-postgres
    description: List recent notifications.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of notifications to return.
    statement: 'SELECT id, user_id, title, message, type, is_read, created_at

      FROM th2agent_dev.notifications

      ORDER BY created_at DESC

      LIMIT $1;

      '
    kind: postgres-sql
  list-webhook-logs:
    source: th2-postgres
    description: List recent webhook execution logs.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of logs to return.
    statement: 'SELECT id, subscription_id, status, metadata, created_at

      FROM th2agent_dev.webhook_logs

      ORDER BY created_at DESC

      LIMIT $1;

      '
    kind: postgres-sql
  list-bi-reports:
    source: th2-postgres
    description: List business intelligence reports.
    parameters:
    - name: limit
      type: integer
      description: Maximum number of reports to return.
    statement: 'SELECT *

      FROM th2agent_dev.business_intelligence

      ORDER BY created_at DESC

      LIMIT $1;

      '
    kind: postgres-sql
  execute-sql:
    source: th2-postgres
    description: 'Execute any SQL statement against the database. Use this to run ad-hoc

      queries, create/alter tables, or perform data operations. The agent

      provides the SQL at runtime. Use with caution.

      '
    kind: postgres-execute-sql
  database-overview:
    source: th2-postgres
    description: 'Fetch the current state of the PostgreSQL server: version, uptime,

      max connections, current/active connections, and connection usage percentage.

      '
    kind: postgres-database-overview
  list-active-queries:
    source: th2-postgres
    description: 'List currently running queries on the database with their PID, duration,

      state, and SQL text. Useful for debugging slow queries or deadlocks.

      '
    kind: postgres-list-active-queries
  list-database-stats:
    source: th2-postgres
    description: 'List key performance and activity statistics for all databases:

      commits, rollbacks, cache hit ratio, temp files, and deadlocks.

      '
    kind: postgres-list-database-stats
  list-table-stats:
    source: th2-postgres
    description: 'Report per-table statistics including row counts, sequential/index scans,

      dead tuples, table size, and bloat metrics.

      '
    kind: postgres-list-table-stats
  list-query-stats:
    source: th2-postgres
    description: 'List query execution statistics from pg_stat_statements: call counts,

      total/mean time, rows returned, and shared buffer usage.

      '
    kind: postgres-list-query-stats
  list-locks:
    source: th2-postgres
    description: 'List active locks with associated process information. Useful for

      detecting lock contention and blocked transactions.

      '
    kind: postgres-list-locks
  long-running-transactions:
    source: th2-postgres
    description: 'Identify transactions that have been running for an extended period.

      Helps detect stuck or forgotten transactions holding locks.

      '
    kind: postgres-long-running-transactions
  replication-stats:
    source: th2-postgres
    description: 'Report WAL streaming replication metrics: replica state, sent/written/flushed

      LSN positions, and replication lag.

      '
    kind: postgres-replication-stats
  list-tables:
    source: th2-postgres
    description: 'List schema information for all or specified tables: columns, types,

      constraints, indexes, triggers, and comments. Accepts optional

      table_names filter and output_format (simple or detailed).

      '
    kind: postgres-list-tables
  list-schemas:
    source: th2-postgres
    description: 'List all user-defined schemas in the database with their owners.

      '
    kind: postgres-list-schemas
  list-indexes:
    source: th2-postgres
    description: 'List all indexes in the database: table, index name, columns,

      type (btree/hash/gin/gist), uniqueness, and size.

      '
    kind: postgres-list-indexes
  list-views:
    source: th2-postgres
    description: 'List all views in the database with their definitions.

      '
    kind: postgres-list-views
  list-sequences:
    source: th2-postgres
    description: 'List all sequences in the database with current values,

      increments, and min/max bounds.

      '
    kind: postgres-list-sequences
  list-triggers:
    source: th2-postgres
    description: 'List all triggers: table, trigger name, event (INSERT/UPDATE/DELETE),

      timing (BEFORE/AFTER), and function called.

      '
    kind: postgres-list-triggers
  list-stored-procedures:
    source: th2-postgres
    description: 'List stored procedures and functions with their parameter signatures,

      return types, and language.

      '
    kind: postgres-list-stored-procedure
  list-tablespaces:
    source: th2-postgres
    description: 'List all tablespaces with their locations and owners.

      '
    kind: postgres-list-tablespaces
  list-roles:
    source: th2-postgres
    description: 'List all user-created database roles with their attributes

      (superuser, login, createdb, etc.) and memberships.

      '
    kind: postgres-list-roles
  list-available-extensions:
    source: th2-postgres
    description: 'List all PostgreSQL extensions available for installation

      with their versions.

      '
    kind: postgres-list-available-extensions
  list-installed-extensions:
    source: th2-postgres
    description: 'List currently installed PostgreSQL extensions with their versions.

      '
    kind: postgres-list-installed-extensions
  list-pg-settings:
    source: th2-postgres
    description: 'List PostgreSQL runtime configuration settings (postgresql.conf values)

      with current values, defaults, and context.

      '
    kind: postgres-list-pg-settings
  list-publication-tables:
    source: th2-postgres
    description: 'List logical replication publication tables and their configurations.

      '
    kind: postgres-list-publication-tables
  get-column-cardinality:
    source: th2-postgres
    description: 'Estimate the number of unique (distinct) values in specified columns.

      Useful for query optimization and understanding data distribution.

      '
    kind: postgres-get-column-cardinality
toolsets:
  admin-tools:
  - search-agents
  - list-agents
  - get-agent-details
  - list-tool-configs
  - count-users
  - list-users
  - list-integrations
  - agent-stats
  agent-discovery:
  - search-agents
  - list-agents
  - get-agent-details
  - search-hub-agents
  monitoring:
  - database-overview
  - list-active-queries
  - list-database-stats
  - list-table-stats
  - list-query-stats
  - list-locks
  - long-running-transactions
  - replication-stats
  schema-introspection:
  - list-tables
  - list-schemas
  - list-indexes
  - list-views
  - list-sequences
  - list-triggers
  - list-stored-procedures
  - list-tablespaces
  - get-column-cardinality
  db-admin:
  - list-roles
  - list-available-extensions
  - list-installed-extensions
  - list-pg-settings
  - list-publication-tables
  - execute-sql
  webhooks:
  - list-webhook-subscriptions
  - list-webhook-logs
  - list-notifications
  billing:
  - list-transactions
  - count-users
  - list-users
  business-intelligence:
  - list-bi-reports
  - agent-stats
  - execute-sql
