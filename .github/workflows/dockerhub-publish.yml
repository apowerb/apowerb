name: Build and publish Docker image

on:
  workflow_run:
    workflows: ["Upload Python Package"]
    types: [completed]

permissions:
  contents: read

jobs:
  dockerhub-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version from the PyPI workflow tag
        id: release
        shell: bash
        run: |
          VERSION="${{ github.event.workflow_run.head_branch }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # This workflow starts as soon as "Upload Python Package" reports
      # success, but PyPI's index takes some time to propagate a freshly
      # published release. The Docker build below installs
      # "apowerb==${VERSION}" straight from PyPI, so building immediately is
      # a race. Releases 0.1.11 and 0.1.12 both hit it: the build failed
      # with "Because there is no version of apowerb==X and you require
      # apowerb==X, we can conclude that your requirements are
      # unsatisfiable", and both succeeded on manual re-run once PyPI had
      # caught up. Poll for the exact release instead of guessing a sleep.
      - name: Wait for the release to be installable from PyPI
        shell: bash
        env:
          PACKAGE_NAME: apowerb
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/wait-for-pypi-release.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APPOWERB_VERSION=${{ steps.release.outputs.version }}
          tags: |
            apowerb/apowerb:${{ steps.release.outputs.version }}
            apowerb/apowerb:latest
