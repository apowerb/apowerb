name: Build and publish Docker image

# Triggered by the release itself, like "Upload Python Package" next door and
# like the UI image -- no longer by that PyPI run completing. Chaining on
# `workflow_run` forced this workflow to check out `workflow_run.head_sha`, a
# ref CodeQL flags as untrusted in a job holding the Docker Hub token
# (actions/untrusted-checkout). On a release the checkout is the tag itself.
# The image installs the wheel from PyPI, so the build still has to wait for
# it: that is what the PyPI propagation wait below is for, and it now also
# covers the ~40 s the upload itself takes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v); must already be on PyPI"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: apowerb/apowerb

jobs:
  release:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      # On a release this is the tag, so the Dockerfile and build context are
      # exactly the tree that produced the wheel being installed.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release version
        id: release
        shell: bash
        env:
          # Passed as env vars (not interpolated into the script body) so a
          # crafted tag or input can't break out of the string and inject
          # shell commands into this step.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "release" ]; then
            REF="${GITHUB_REF_NAME}"
          else
            REF="${INPUT_VERSION}"
          fi
          VERSION="${REF#v}"
          # Refuse anything that is not a version instead of publishing an
          # image tagged with it.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc.dev+-][0-9A-Za-z.+-]*)?$ ]]; then
            echo "::error::refusing to publish an image tagged '${VERSION}' -- expected a version like 1.2.3, got '${REF}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # This workflow starts with the release, alongside "Upload Python
      # Package", and PyPI's index then takes some time to propagate the
      # freshly published release. The Docker build below installs
      # "apowerb==${VERSION}" straight from PyPI via `uv pip install
      # --system`, so building immediately is a race. Releases 0.1.11 and
      # 0.1.12 both hit it: the build failed with "Because there is no
      # version of apowerb==X and you require apowerb==X, we can conclude
      # that your requirements are unsatisfiable", and both succeeded on
      # manual re-run once PyPI had caught up.
      #
      # This step runs the same `uv pip install --dry-run --system` the
      # Dockerfile runs, so it fails and succeeds under exactly the
      # condition the real build depends on. Polling PyPI's JSON metadata
      # endpoint instead (an earlier version of this fix did) would check a
      # different code path than the Simple index the resolver reads, and
      # could report "available" before the resolver agrees.
      #
      # It is waited for once here, before either architecture is built, so
      # the two build jobs cannot race PyPI independently.
      - name: Wait for the release to resolve on PyPI
        shell: bash
        env:
          PACKAGE_NAME: apowerb
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/wait-for-pypi-release.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each runner builds its own architecture natively and pushes an
      # untagged image; the manifest list that carries the tags is assembled
      # below. QEMU is gone with the emulated half of the build.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APPOWERB_VERSION=${{ needs.release.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest reads `sha256:<hex>`; the file keeps only the hex, which
      # the manifest step prefixes back with `@sha256:`.
      - name: Export the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          # One artifact per platform: v4 refuses to have two jobs write the
          # same artifact name.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the image to Docker Hub
    needs: [release, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tags only ever move once both architectures exist, so an
      # interrupted or half-failed release cannot leave `latest` pointing at a
      # single-arch image.
      - name: Create the manifest list
        shell: bash
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the published image
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
