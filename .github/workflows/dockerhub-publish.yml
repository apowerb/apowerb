name: Build and publish Docker image

on:
  workflow_run:
    workflows: ["Upload Python Package"]
    types: [completed]

permissions:
  contents: read

env:
  IMAGE: apowerb/apowerb

jobs:
  release:
    name: Resolve the release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      # Pinned to the commit the upstream "Upload Python Package" run was
      # built from, not to whatever the default branch holds when this run
      # starts. Without `ref`, checkout takes the branch tip: a merge landing
      # between the two runs would build this image from a tree that never
      # produced the wheel being installed. The Dockerfile and build context
      # come from here, so they must match the release being published.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release version from the PyPI workflow tag
        id: release
        shell: bash
        env:
          # Passed as an env var (not interpolated into the script body) so an
          # attacker-controlled branch/tag name can't break out of the string
          # and inject arbitrary shell commands into this step.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${HEAD_BRANCH#v}"
          # `head_branch` is whatever ref started the upstream run. On a release
          # that is the tag, but nothing guarantees it: a branch name would sail
          # through and get published as an image tag. The UI workflow already
          # refuses anything that is not a version; the core one did not.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc.dev+-][0-9A-Za-z.+-]*)?$ ]]; then
            echo "::error::refusing to publish an image tagged '${VERSION}' -- expected a version like 1.2.3, got the upstream ref '${HEAD_BRANCH}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # This workflow starts as soon as "Upload Python Package" reports
      # success, but PyPI's index takes some time to propagate a freshly
      # published release. The Docker build below installs
      # "apowerb==${VERSION}" straight from PyPI via `uv pip install
      # --system`, so building immediately is a race. Releases 0.1.11 and
      # 0.1.12 both hit it: the build failed with "Because there is no
      # version of apowerb==X and you require apowerb==X, we can conclude
      # that your requirements are unsatisfiable", and both succeeded on
      # manual re-run once PyPI had caught up.
      #
      # This step runs the same `uv pip install --dry-run --system` the
      # Dockerfile runs, so it fails and succeeds under exactly the
      # condition the real build depends on. Polling PyPI's JSON metadata
      # endpoint instead (an earlier version of this fix did) would check a
      # different code path than the Simple index the resolver reads, and
      # could report "available" before the resolver agrees.
      #
      # It is waited for once here, before either architecture is built, so
      # the two build jobs cannot race PyPI independently.
      - name: Wait for the release to resolve on PyPI
        shell: bash
        env:
          PACKAGE_NAME: apowerb
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/wait-for-pypi-release.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each runner builds its own architecture natively and pushes an
      # untagged image; the manifest list that carries the tags is assembled
      # below. QEMU is gone with the emulated half of the build.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APPOWERB_VERSION=${{ needs.release.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          # One artifact per platform: v4 refuses to have two jobs write the
          # same artifact name.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the image to Docker Hub
    needs: [release, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tags only ever move once both architectures exist, so an
      # interrupted or half-failed release cannot leave `latest` pointing at a
      # single-arch image.
      - name: Create the manifest list
        shell: bash
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the published image
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
