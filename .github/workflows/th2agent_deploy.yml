name: Deploy th2agent api to Remote Server

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'iac/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/th2agent_deploy.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  # Determine which environment to deploy to
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      domain: ${{ steps.set-env.outputs.domain }}
      port: ${{ steps.set-env.outputs.port }}
      deploy_dev: ${{ steps.set-env.outputs.deploy_dev }}
      deploy_prod: ${{ steps.set-env.outputs.deploy_prod }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          DEPLOY_DEV="false"
          DEPLOY_PROD="false"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger - deploy to selected environment
            ENV="${{ github.event.inputs.environment }}"
            if [ "$ENV" == "prod" ]; then
              DEPLOY_PROD="true"
            else
              DEPLOY_DEV="true"
            fi
          elif [ "${{ github.event_name }}" == "release" ]; then
            # Release published - deploy to prod
            ENV="prod"
            DEPLOY_PROD="true"
          elif [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # Push to main - deploy to dev
            ENV="dev"
            DEPLOY_DEV="true"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "deploy_dev=$DEPLOY_DEV" >> $GITHUB_OUTPUT
          echo "deploy_prod=$DEPLOY_PROD" >> $GITHUB_OUTPUT

          if [ "$ENV" == "prod" ]; then
            echo "domain=api-agent.thaink2.fr" >> $GITHUB_OUTPUT
            echo "port=8004" >> $GITHUB_OUTPUT
          else
            echo "domain=api-agent-dev.thaink2.fr" >> $GITHUB_OUTPUT
            echo "port=8005" >> $GITHUB_OUTPUT
          fi

          echo "🎯 Deploying to: $ENV"
          echo "🌐 Domain: $([ "$ENV" == "prod" ] && echo "api-agent.thaink2.fr" || echo "api-agent-dev.thaink2.fr")"

  # Dev deployment (on push to main)
  deploy-dev:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.deploy_dev == 'true'
    environment:
      name: development
      url: https://api-agent-dev.thaink2.fr

    # Serialise les deploys DEV : deux runs qui rsync/chmod le meme repertoire
    # sur la VM se detruisent mutuellement (un run supprime les fichiers qu'un
    # autre est en train de chmod). La cle porte sur la RESSOURCE (la VM DEV),
    # pas sur github.ref : un workflow_dispatch lance depuis une autre branche
    # vise la meme VM et doit prendre le meme verrou.
    # cancel-in-progress: false — annuler en plein rsync laisserait la VM
    # incoherente. On met en file d'attente, on n'interrompt jamais.
    concurrency:
      group: deploy-dev-th2agent
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    #   - name: Create .env file for Dev
    #     run: |
    #       echo "ENVIRONMENT=development" > .env
    #       echo "PORT=8005" >> .env
    #       echo "DOMAIN=api-agent-dev.thaink2.fr" >> .env
    #       echo "✅ Created .env file for DEV"
    #       cat .env

      - name: Create deployment directory on Dev VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /home/ubuntu/thaink2/th2agent
            # Le parent /home/ubuntu/thaink2 est partage avec th2agent-app.
            # Un -R ici traverse .../th2agent-app/** pendant que l'autre repo y
            # fait son `rm -rf src/` => "chmod: cannot access ...: No such file
            # or directory". Le recursif reste confine a notre propre
            # repertoire ; le verrou concurrency ne couvre pas cette course, il
            # est scope par repo.
            sudo chown $USER:$USER /home/ubuntu/thaink2
            sudo chmod 755 /home/ubuntu/thaink2
            sudo chown -R $USER:$USER /home/ubuntu/thaink2/th2agent
            sudo chmod -R 755 /home/ubuntu/thaink2/th2agent

      - name: Copy files to Dev VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".,!.git"
          target: "/home/ubuntu/thaink2/th2agent"
          rm: false

      # scp above uses rm:false (keeps .env/.venv). It never DELETES files
      # removed from the repo, so modules extracted out of the core (e.g. the
      # SCEI overlay migration) survive as stale portfolio residue and leak via
      # /tools. Re-sync src/ with --delete to prune orphans. src/ is code-only
      # (no .env/.venv/.release-version live there), so --delete is safe here.
      - name: Prune stale source files on Dev VM (rsync --delete on src/)
        run: |
          install -m 600 /dev/stdin "$HOME/.ssh_dev_key" <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh_dev_key" \
            ./src/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST_DEV }}:/home/ubuntu/thaink2/th2agent/src/"
          rm -f "$HOME/.ssh_dev_key"

      - name: Deploy Dev API
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/deploy.sh
            ./iac/deploy.sh

      - name: Configure Nginx for Dev
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/setup-nginx.sh
            sudo ./iac/setup-nginx.sh

      - name: Setup SSL Certificate for Dev
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_DEV }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/setup-ssl.sh
            sudo ./iac/setup-ssl.sh

      - name: Dev Deployment Status
        if: success()
        run: |
          echo "🚀 th2agent api deployed successfully to DEV!"
          echo "🌐 Access it at: https://api-agent-dev.thaink2.fr"
          echo "📚 Docs at: https://api-agent-dev.thaink2.fr/docs"
          echo "🔧 Environment: Development"
          echo "🔌 Port: 8005"
          echo "💻 Server: DEV VM"

      - name: Dev Deployment Failed
        if: failure()
        run: |
          echo "❌ Dev deployment failed. Check the logs above."
          exit 1

  # Prod deployment (on release)
  deploy-prod:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.deploy_prod == 'true'
    environment:
      name: production
      url: https://api-agent.thaink2.fr

    # Meme verrou pour PROD (deux releases publiees coup sur coup).
    concurrency:
      group: deploy-prod-th2agent
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

    #   - name: Create .env file for Prod
    #     run: |
    #       echo "ENVIRONMENT=production" > .env
    #       echo "PORT=8004" >> .env
    #       echo "DOMAIN=api-agent.thaink2.fr" >> .env
    #       echo "✅ Created .env file for PROD"
    #       cat .env

      - name: Create deployment directory on Prod VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /home/ubuntu/thaink2/th2agent
            # Le parent /home/ubuntu/thaink2 est partage avec th2agent-app.
            # Un -R ici traverse .../th2agent-app/** pendant que l'autre repo y
            # fait son `rm -rf src/` => "chmod: cannot access ...: No such file
            # or directory". Le recursif reste confine a notre propre
            # repertoire ; le verrou concurrency ne couvre pas cette course, il
            # est scope par repo.
            sudo chown $USER:$USER /home/ubuntu/thaink2
            sudo chmod 755 /home/ubuntu/thaink2
            sudo chown -R $USER:$USER /home/ubuntu/thaink2/th2agent
            sudo chmod -R 755 /home/ubuntu/thaink2/th2agent

      - name: Copy files to Prod VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".,!.git"
          target: "/home/ubuntu/thaink2/th2agent"
          rm: false

      - name: Deploy Prod API
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/deploy.sh
            ./iac/deploy.sh

      - name: Configure Nginx for Prod
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/setup-nginx.sh
            sudo ./iac/setup-nginx.sh

      - name: Setup SSL Certificate for Prod
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/thaink2/th2agent/
            chmod +x iac/setup-ssl.sh
            sudo ./iac/setup-ssl.sh

      - name: Prod Deployment Status
        if: success()
        run: |
          echo "🚀 th2agent api deployed successfully to PRODUCTION!"
          echo "🌐 Access it at: https://api-agent.thaink2.fr"
          echo "📚 Docs at: https://api-agent.thaink2.fr/docs"
          echo "⚠️  Environment: Production"
          echo "🔌 Port: 8004"
          echo "💻 Server: PROD VM"
          echo "🏷️  Release: ${{ github.event.release.tag_name }}"

      - name: Prod Deployment Failed
        if: failure()
        run: |
          echo "❌ Production deployment failed. Check the logs above."
          exit 1

  # Summary
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [setup, deploy-dev, deploy-prod]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Trigger: ${{ github.event_name }}"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Domain: ${{ needs.setup.outputs.domain }}"
          echo "Port: ${{ needs.setup.outputs.port }}"
          echo ""

          # `cancelled` = le job a ete evince de la file du groupe concurrency
          # par un run plus recent : ce n'est pas un echec, il ne faut pas le
          # signaler comme tel.
          if [ "${{ needs.setup.outputs.deploy_dev }}" == "true" ]; then
            case "${{ needs.deploy-dev.result }}" in
              success)   echo "✅ DEV deployment completed successfully!" ;;
              cancelled) echo "⏭️  DEV deployment superseded by a newer run (concurrency queue)." ;;
              *)         echo "❌ DEV deployment failed!" ;;
            esac
          fi

          if [ "${{ needs.setup.outputs.deploy_prod }}" == "true" ]; then
            case "${{ needs.deploy-prod.result }}" in
              success)   echo "✅ PROD deployment completed successfully!" ;;
              cancelled) echo "⏭️  PROD deployment superseded by a newer run (concurrency queue)." ;;
              *)         echo "❌ PROD deployment failed!" ;;
            esac
          fi
