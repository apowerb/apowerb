name: Build and verify Docker image

# dockerhub-publish.yml only runs after a PyPI release, and only pushes --
# it never verifies the build on a pull request. A broken Dockerfile, or a
# regression from stripping down the runtime image (see the perl-base /
# build-toolchain removal in this same PR), would only surface at release
# time, against the real Docker Hub tags. This workflow builds the image on
# every PR that touches it and smoke-tests the result, so that risk is
# caught before merge instead of after a release.
#
# The Dockerfile installs the already-published `apowerb` PyPI package
# (via APPOWERB_VERSION), not this PR's checked-out source -- it has no way
# to build from local source. This job therefore verifies the Dockerfile's
# own mechanics (base image, system packages, venv layout) against the
# latest published release, not this PR's Python changes. That is the
# correct scope for a Dockerfile-focused check; app code changes are
# already covered by build.yaml and tests.yml.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-build-verify.yml
  workflow_dispatch:

jobs:
  docker-build-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Only for the /health check below: the server refuses to boot without
      # DB_HOST/DB_NAME/DB_USER/DB_PASSWORD. Fresh and throwaway on every run.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_USER: postgres
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest published apowerb version from PyPI
        id: pypi
        run: |
          VERSION=$(curl -sf https://pypi.org/pypi/apowerb/json | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No push, no Docker Hub credentials: this only ever builds and loads
      # the image into the local Docker daemon for the smoke test below.
      - name: Build image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            APPOWERB_VERSION=${{ steps.pypi.outputs.version }}
          tags: apowerb:pr-verify

      - name: Smoke test — system packages
        run: |
          set -e

          echo "== perl must be fully absent =="
          docker run --rm apowerb:pr-verify sh -c '
            if command -v perl >/dev/null 2>&1; then
              echo "FAIL: perl binary found on PATH"; exit 1
            fi
            if dpkg -l 2>/dev/null | grep -Eqi "^ii +perl"; then
              echo "FAIL: a perl* package is still installed"
              dpkg -l | grep -Ei "perl"
              exit 1
            fi
            echo "OK: no perl binary, no perl* package"
          '

          echo "== compiler toolchain must not ship in the runtime image =="
          docker run --rm apowerb:pr-verify sh -c '
            for pkg in gcc g++ build-essential; do
              if dpkg -l 2>/dev/null | grep -Eqi "^ii +${pkg} "; then
                echo "FAIL: ${pkg} is present in the runtime image"; exit 1
              fi
            done
            echo "OK: no gcc/g++/build-essential"
          '

          echo "== venv and console script must be in place =="
          docker run --rm apowerb:pr-verify sh -c '
            test -x /opt/venv/bin/python || { echo "FAIL: /opt/venv/bin/python missing"; exit 1; }
            /opt/venv/bin/apowerb --help >/dev/null || { echo "FAIL: apowerb --help failed"; exit 1; }
            echo "OK: venv and console script work"
          '

      - name: Smoke test — heavy dependency imports
        run: |
          set -e
          docker run --rm apowerb:pr-verify /opt/venv/bin/python -c "
          import google.adk
          import litellm
          import sqlalchemy
          import cryptography
          import pandas
          import pyodbc
          import psycopg2
          print('OK: google-adk, litellm, sqlalchemy, cryptography, pandas, pyodbc, psycopg2 all import cleanly')
          "

      # The image must ship the versions uv.lock pins, not a fresh resolve:
      # 0.2.86 shipped google-adk 2.12.0 instead of the locked 2.9.2 and the
      # import test above still passed.
      # uv.lock can hold several versions of one package, one per Python
      # range: since google-adk 2.12 (#415), 2.11.0 below Python 3.11 and
      # 2.12.0 from 3.11 on. Compare with the entry whose resolution markers
      # match the image's own interpreter, evaluated inside the image, not
      # with the first entry of the file (which made this step fail on a
      # correct 3.13 image).
      - name: Smoke test — locked dependency versions
        run: |
          set -e
          for pkg in google-adk litellm; do
            docker run --rm -v "$PWD/uv.lock:/tmp/uv.lock:ro" apowerb:pr-verify /opt/venv/bin/python -c '
          import importlib.metadata, sys, tomllib
          from packaging.markers import Marker
          name = sys.argv[1]
          entries = [p for p in tomllib.load(open("/tmp/uv.lock", "rb"))["package"] if p["name"] == name]
          want = [
              p["version"] for p in entries
              if not p.get("resolution-markers")
              or any(Marker(m).evaluate() for m in p["resolution-markers"])
          ]
          got = importlib.metadata.version(name)
          if want != [got]:
              sys.exit(f"FAIL: {name} {got} in the image, {want} in uv.lock for this interpreter")
          print(f"OK: {name} {got} matches uv.lock")
          ' "$pkg"
          done

      # The Dockerfile purges libuuid1 and ncurses (see the comment there).
      # Assert they stay gone and that nothing left in the image links one of
      # their shared objects: a consumer added later would otherwise only fail
      # at import or call time in production.
      - name: Smoke test — purged libraries have no consumer left
        run: |
          set -e
          docker run --rm --entrypoint sh apowerb:pr-verify -c '
            for pkg in libuuid1 libncursesw6 ncurses-bin ncurses-base; do
              if dpkg-query -W -f="\${Status}" "$pkg" 2>/dev/null | grep -q "ok installed"; then
                echo "FAIL: $pkg is installed"; exit 1
              fi
            done
            broken=$(find / -xdev -type f \( -name "*.so" -o -name "*.so.*" \) 2>/dev/null \
              | while read -r f; do
                  ldd "$f" 2>/dev/null | grep -Eq "lib(uuid|ncursesw|formw|menuw|panelw)\.so[^ ]* => not found" && echo "$f"
                done || true)
            if [ -n "$broken" ]; then echo "FAIL: still linked against a purged library:"; echo "$broken"; exit 1; fi
            echo "OK: purged packages absent, no shared object links them"
          '
          docker run --rm apowerb:pr-verify /opt/venv/bin/python -c "
          import uuid
          assert uuid.uuid4().version == 4 and uuid.uuid1().version == 1
          import readline
          print('OK: uuid1/uuid4 and readline work without libuuid1 / libncursesw6')
          "

      - name: Smoke test — the server boots and answers /health
        run: |
          set -e
          KEY=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          docker run -d --name apowerb-health --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=smoke \
            -e DB_USER=postgres -e DB_PASSWORD=smoke -e DB_SSLMODE=disable -e ENCRYPT_KEY="$KEY" \
            apowerb:pr-verify
          for attempt in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8000/health; then
              echo; echo "OK: /health answered (attempt ${attempt}/60)"; exit 0
            fi
            sleep 2
          done
          echo "FAIL: /health never answered"; docker logs apowerb-health; exit 1

      - name: Stop the /health container
        if: always()
        run: docker rm -f apowerb-health >/dev/null 2>&1 || true

      # Same scanner and version as the measurements recorded for this image,
      # so the numbers compare. Report only: the HIGH left are Debian packages
      # with no published fix, and failing on them would block every PR.
      - name: Trivy scan of the built image (CRITICAL, HIGH)
        run: |
          set -e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.68.1 \
            image -q --severity CRITICAL,HIGH --format json -o /out/trivy-apowerb.json apowerb:pr-verify
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.68.1 convert -q --format table /out/trivy-apowerb.json

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-apowerb
          path: trivy-apowerb.json
          if-no-files-found: ignore
