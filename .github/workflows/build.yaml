name: Build and verify package

# Checks that apowerb stays consumable as a library: the wheel builds,
# construit, s'installe dans un environnement vierge, et s'importe sans
# aucune variable d'environnement — sans toucher la base ni le disque.
# C'est le contrat que le refactor de packaging a établi ; ce workflow
# existe pour qu'il ne régresse pas silencieusement.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel into a bare virtualenv
        run: |
          uv venv /tmp/verify-venv --python 3.13
          uv pip install --python /tmp/verify-venv/bin/python dist/*.whl

      # Le test décisif : un interpréteur sans aucune variable
      # d'environnement, dans un répertoire vide. Historiquement, cet
      # import exigeait un .env complet, jouait 15 migrations sur une vraie
      # base et créait des dossiers. Il doit désormais être inerte.
      - name: Import with zero environment, in an empty directory
        run: |
          mkdir -p /tmp/empty-cwd
          cd /tmp/empty-cwd
          env -i HOME="$HOME" PATH=/usr/bin:/bin /tmp/verify-venv/bin/python - <<'PY'
          import pathlib

          import apowerb.main  # ne doit ni migrer, ni exiger de config
          from apowerb.configs.settings import get_settings
          from apowerb.helpers import encryptor

          assert encryptor.fernet is None, "fernet devrait être None sans ENCRYPT_KEY"
          assert get_settings().missing_runtime_fields(), "la config devrait être vide ici"

          # Seule écriture tolérée : le dossier d'artefacts que Google ADK
          # crée lui-même dans get_fast_api_app(). Toute autre est un
          # effet de bord d'import qui n'a rien à faire là.
          written = sorted(p.name for p in pathlib.Path.cwd().iterdir())
          assert written in ([], ["artifacts_store"]), (
              f"l'import a écrit sur le disque: {written}"
          )

          try:
              get_settings().assert_runtime_ready()
          except RuntimeError as exc:
              assert "DB_HOST" in str(exc), exc
          else:
              raise AssertionError("le boot aurait dû être refusé sans configuration")

          print("OK — import inerte, refus de boot explicite")
          PY

      - name: Console script resolves
        run: /tmp/verify-venv/bin/apowerb --help > /dev/null

      - name: Library import test suite
        run: uv run --group dev pytest tests/test_library_import.py -q
